# Despliegue de EXPANSIONdeDOMINIO en el VPS.
# La contraseña de las estadísticas (STATS_PASS) se define en las variables de entorno
# del proyecto en Hostinger, nunca en este archivo.
services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      STATS_PASS: ${STATS_PASS}
    volumes:
      - logs:/var/log/nginx-stats
      - report:/usr/share/nginx/stats
    command: ["sh", "-c", "until wget -qO /tmp/site.tgz https://codeload.github.com/macbook7605-ship-it/EXPANSIONdeDOMINIO/tar.gz/refs/heads/main; do echo Esperando; sleep 10; done; mkdir -p /tmp/x && tar xzf /tmp/site.tgz -C /tmp/x && sh /tmp/x/EXPANSIONdeDOMINIO-main/deploy/arranque-web.sh"]
  stats:
    image: allinurl/goaccess:latest
    restart: unless-stopped
    volumes:
      - logs:/logs:ro
      - report:/report
    entrypoint: ["sh", "-c", "until [ -f /logs/access.log ]; do sleep 5; done; while true; do goaccess /logs/access.log --log-format=COMBINED --html-report-title='EXPANSIONdeDOMINIO' -o /report/index.html 2>/dev/null; sleep 300; done"]
volumes:
  logs:
    name: expansion_logs
  report:
    name: expansion_report
