server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Registro para las estadísticas (GoAccess lo lee desde el volumen compartido)
    access_log /var/log/nginx-stats/access.log combined;

    # Botón de compra: redirige a Hotmart y deja constancia del clic en el registro.
    # CAMBIAR el destino por el enlace de Hotmart cuando el producto esté publicado.
    location = /la-bestia-emocional/comprar {
        return 302 /la-bestia-emocional/#completa;
    }

    # Panel de estadísticas privado (con contraseña, no se registra a sí mismo)
    location ^~ /estadisticas/ {
        access_log off;
        auth_basic "Estadisticas EXPANSIONdeDOMINIO";
        auth_basic_user_file /etc/nginx/stats.htpasswd;
        alias /usr/share/nginx/stats/;
        add_header Cache-Control "no-store";
    }

    location ~* \.(css|jpg|jpeg|png|webp|svg)$ {
        expires 7d;
    }
}
