# Dirección pública del sitio: respeta https cuando llega a través de Caddy
map $http_x_forwarded_proto $site_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sustituye __SITE__ por la dirección real (IP de prueba hoy, dominio mañana)
    sub_filter '__SITE__' '$site_proto://$http_host';
    sub_filter_once off;
    sub_filter_types text/xml application/xml text/plain;

    # Registro para las estadísticas (GoAccess lo lee desde el volumen compartido)
    access_log /var/log/nginx-stats/access.log combined;

    # Botón de compra: redirige a Hotmart y deja constancia del clic en el registro.
    # CAMBIAR el destino por el enlace de Hotmart cuando el producto esté publicado.
    location = /habitos-emocionales/comprar {
        return 302 /habitos-emocionales/#completa;
    }

    # Dirección antigua del ebook: redirige a la nueva
    location ^~ /la-bestia-emocional/ {
        return 301 /habitos-emocionales/;
    }

    # Panel de estadísticas privado (con contraseña, no se registra a sí mismo)
    location ^~ /estadisticas/ {
        access_log off;
        auth_basic "Estadisticas EXPANSIONdeDOMINIO";
        auth_basic_user_file /etc/nginx/stats.htpasswd;
        alias /usr/share/nginx/stats/;
        add_header Cache-Control "no-store";
    }

    location ~* \.(css|jpg|jpeg|png|webp|svg)$ {
        expires 7d;
    }
}
